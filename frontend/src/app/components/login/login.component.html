<div class="auth-page-container fade-slide">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Sign in to manage your internship applications and pipeline</p>
    </div>

    <!-- Error Banner -->
    <div *ngIf="errorMessage" class="auth-alert error-banner">
      <span class="alert-icon">⚠️</span>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-input"
            placeholder="you@domain.com"
            autocomplete="email"
          />
        </div>
        <span class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email address
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
            title="Toggle password view"
          >
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters
        </span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary btn-auth-submit"
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="loading" class="spinner-small"></span>
        <span>{{ loading ? 'Authenticating...' : 'Sign In' }}</span>
      </button>

      <!-- Demo Autofill Helper -->
      <div class="demo-box">
        <span>Quick test?</span>
        <button type="button" class="btn-demo" (click)="fillDemo()">Autofill Demo Account</button>
      </div>

      <!-- Footer / Switch to Register -->
      <div class="auth-footer">
        <p>Don't have an account yet? <a routerLink="/register" class="auth-link">Create one now &rarr;</a></p>
      </div>
    </form>
  </div>
</div>
