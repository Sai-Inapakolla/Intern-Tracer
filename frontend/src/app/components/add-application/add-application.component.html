<div class="add-application-container">
  <h1>Add New Application</h1>

  <div class="form-container">
    <form [formGroup]="applicationForm" (ngSubmit)="addApplication()">
      <div class="form-group">
        <label for="company">Company Name *</label>
        <input
          type="text"
          id="company"
          formControlName="company"
          class="form-input"
          placeholder="e.g., Google, Microsoft"
        />
        <span class="error" *ngIf="applicationForm.get('company')?.invalid && applicationForm.get('company')?.touched">
          Company name is required
        </span>
      </div>

      <div class="form-group">
        <label for="role">Job Role *</label>
        <input
          type="text"
          id="role"
          formControlName="role"
          class="form-input"
          placeholder="e.g., Software Engineer, Product Manager"
        />
        <span class="error" *ngIf="applicationForm.get('role')?.invalid && applicationForm.get('role')?.touched">
          Job role is required
        </span>
      </div>

      <div class="form-group">
        <label for="appliedDate">Applied Date *</label>
        <input
          type="date"
          id="appliedDate"
          formControlName="appliedDate"
          class="form-input"
        />
        <span class="error" *ngIf="applicationForm.get('appliedDate')?.invalid && applicationForm.get('appliedDate')?.touched">
          Applied date is required
        </span>
      </div>

      <div class="form-group">
        <label for="status">Status *</label>
        <select id="status" formControlName="status" class="form-input">
          <option *ngFor="let status of statusOptions" [value]="status">
            {{ status }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea
          id="notes"
          formControlName="notes"
          class="form-textarea"
          placeholder="Add any additional notes about the application..."
          rows="4"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="resume">Upload Resume (Optional)</label>
        <input
          type="file"
          id="resume"
          (change)="onFileSelected($event)"
          accept=".pdf,.doc,.docx"
          class="form-input"
        />
      </div>

      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="button-group">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading || applicationForm.invalid"
        >
          {{ loading ? 'Adding...' : 'Add Application' }}
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="cancel()"
          [disabled]="loading"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
